<p class="m b"># Switch To YouTube</p>
<div class="abox" data-title="README.md"><div class="body">
<p>A free, open-source web app that moves your Spotify liked songs and playlists to YouTube Music.</p>
<div class="blank"></div>
<dl class="kv">
<dt class="c">stars</dt><dd><span class="y">★ </span><span data-gh="amkashyap1220/SwitchToYoutube" data-field="stars" class="y">--</span></dd>
<dt class="c">commits</dt><dd><span data-gh="amkashyap1220/SwitchToYoutube" data-field="commits" class="g">--</span></dd>
<dt class="c">language</dt><dd><span data-gh="amkashyap1220/SwitchToYoutube" data-field="language" class="m">--</span></dd>
<dt class="c">updated</dt><dd><span data-gh="amkashyap1220/SwitchToYoutube" data-field="updated">--</span></dd>
<dt class="c">stack</dt><dd><ul class="tags"><li>Python</li><li>Flask</li><li>Spotify API (spotipy)</li><li>YouTube Music API (ytmusicapi)</li><li>Docker</li></ul></dd>
<dt class="c">source</dt><dd><span class="g">open github.url</span></dd>
</dl>
</div></div>
<div class="abox" data-title="## What it is"><div class="body">
<p>Switch To YouTube is a small Flask web app. You sign in to Spotify and YouTube Music, pick your liked songs and the playlists you want, and it rebuilds them on YouTube Music.</p>
<div class="blank"></div>
<ol class="num">
<li>Sign in to both services.</li>
<li>Choose your liked songs and/or playlists.</li>
<li>For each song, the app searches YouTube Music and picks the closest match by title, artist, and length.</li>
<li>Liked songs get liked on YouTube Music, and each playlist is recreated with the same name.</li>
<li>At the end, it shows how many songs were found and lists any it couldn't match.</li>
</ol>
</div></div>
<div class="abox" data-title="## Why I made it"><div class="body">
<p>Every tool I could find for moving playlists between services was paid. Moving playlists you already own shouldn't cost money, so I built a free, open-source option anyone can use.</p>
</div></div>
