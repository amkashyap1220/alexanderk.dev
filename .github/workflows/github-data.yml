# Saves the site's GitHub numbers and READMEs to data/github.json, so
# visitors' browsers read that file instead of calling GitHub themselves.
# Runs every 6 hours, after each push to main, and from the Actions tab
# ("Run workflow"). Commits only when something changed; that commit
# redeploys the site like any other push.
name: Refresh GitHub data

on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch from GitHub
        run: python3 .github/scripts/github_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pushes made with GITHUB_TOKEN don't start workflows, so this can't loop
      - name: Commit if changed
        run: |
          git add data/github.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh GitHub data"
            git pull --rebase
            git push
          fi
