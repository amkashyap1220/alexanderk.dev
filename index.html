<div class="hero">
<h1>Switch To YouTube</h1>
<p class="tagline">A free, open-source web app that moves your Spotify liked songs and playlists to YouTube Music.</p>
</div>
<div class="stats">
<span class="stat"><span class="y">★ <span data-gh="amkashyap1220/SwitchToYoutube" data-field="stars">--</span></span> <span class="d">stars</span></span>

<span class="stat"><span class="m"><span data-gh="amkashyap1220/SwitchToYoutube" data-field="language">--</span></span></span>
<span class="stat"><span class="d">updated</span> <span data-gh="amkashyap1220/SwitchToYoutube" data-field="updated">--</span></span>
</div>
<div class="chips"><span class="chip c">Python</span><span class="chip c">Flask</span><span class="chip c">Spotify API (spotipy)</span><span class="chip c">YouTube Music API (ytmusicapi)</span><span class="chip c">Docker</span></div>
<p class="meta"><span>↗ source: <span class="g">open github.webloc</span></span></p>
<section class="doc-sec">
<h2 class="c">What it is</h2>
<p>Switch To YouTube is a small Flask web app. You sign in to Spotify and YouTube Music, pick your liked songs and the playlists you want, and it rebuilds them on YouTube Music.</p>
<ol class="steps">
<li>Sign in to both services.</li>
<li>Choose your liked songs and/or playlists.</li>
<li>For each song, the app searches YouTube Music and picks the closest match by title, artist, and length.</li>
<li>Liked songs get liked on YouTube Music, and each playlist is recreated with the same name.</li>
<li>At the end, it shows how many songs were found and lists any it couldn't match.</li>
</ol>
</section>
<section class="doc-sec">
<h2 class="m">Why I made it</h2>
<p>Every tool I could find for moving playlists between services was paid. Moving playlists you already own shouldn't cost money, so I built a free, open-source option anyone can use.</p>
</section>
