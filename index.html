<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>alexander@alexanderk-dev: ~</title>
  <meta name="description" content="Alexander Kashyap - software developer building data-driven enterprise systems in C#, .NET, SQL, and Python.">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- The whole page is the terminal. js/terminal.js prints output into .out -->
  <div class="scroll" tabindex="-1">
    <main class="term">
      <div class="out" aria-live="polite"></div>

      <!-- The prompt line. The <input> is invisible; the spans draw the typed text and the block cursor. -->
      <form class="cmdline off" autocomplete="off">
        <span class="ps"></span><span class="before"></span><span class="cur"> </span><span class="after"></span>
        <input type="text" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Terminal command">
      </form>

      <noscript><p>This site is a terminal and needs JavaScript to run.</p></noscript>
    </main>
  </div>


  <!-- The files you can `cat` are real Markdown files in files/ -->

  <!-- What `ls -l` shows inside ~/projects (live GitHub numbers fill the data-gh cells) -->
  <template id="tpl-projects-table">
    <div class="tbl">
      <table>
        <thead>
          <tr><th>name</th><th class="num">★ stars</th><th class="num">commits</th><th>language</th><th class="opt">about</th></tr>
        </thead>
        <tbody>
          <tr>
            <td class="bl b">switch-to-youtube/</td>
            <td class="num y" data-gh="amkashyap1220/SwitchToYoutube" data-field="stars">--</td>
            <td class="num g" data-gh="amkashyap1220/SwitchToYoutube" data-field="commits">--</td>
            <td class="m" data-gh="amkashyap1220/SwitchToYoutube" data-field="language">--</td>
            <td class="d opt">Spotify → YouTube Music</td>
          </tr>
          <tr>
            <td class="bl b">alexanderk-dev/</td>
            <td class="num y" data-gh="amkashyap1220/alexanderk.dev" data-field="stars">--</td>
            <td class="num g" data-gh="amkashyap1220/alexanderk.dev" data-field="commits">--</td>
            <td class="m" data-gh="amkashyap1220/alexanderk.dev" data-field="language">--</td>
            <td class="d opt">this website</td>
          </tr>
        </tbody>
      </table>
    </div>
  </template>

  <script src="/js/github.js"></script>
  <script src="/js/terminal.js"></script>
</body>
</html>
